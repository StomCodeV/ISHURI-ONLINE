<style>

    --bg: #050a1f; 
    --panel: #0a162e; 
    --line: rgba(105,170,231,.15); 
    --text: #eef6ff; 
    --muted: #8da4c1; 
    --cyan: #4ab8ff;

  }

  .sidebar-header { padding: 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 800; letter-spacing: .1em; font-size: 13px; }
  .brand img { width: 30px; }
  .syllabus { flex: 1; overflow-y: auto; padding: 20px; }
  .module-title { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: .1em; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
  .module-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .lesson-link { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 6px; transition: .2s; cursor: pointer; border: 1px solid transparent; background: rgba(255,255,255,.02); }
  .lesson-link:hover { background: rgba(74,184,255,.08); color: #fff; }
  .lesson-link.active { background: rgba(74,184,255,.15); color: #fff; border-color: rgba(74,184,255,.4); font-weight: 600; box-shadow: 0 4px 15px rgba(74,184,255,.1); }
  .lesson-link.completed .icon { background: var(--green); color: #041326; border-color: var(--green); }
  .icon { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; border: 1px solid var(--line); flex-shrink: 0; transition: .2s; }
  .lesson-link.active .icon { border-color: var(--cyan); background: var(--cyan); color: #041326; }

  /* MAIN CONTENT */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(ellipse at top right, rgba(40,117,198,.1), transparent 50%), var(--bg); }
  
  /* PROGRESS HEADER */
  .topbar { min-height: 70px; background: rgba(5,10,31,.85); backdrop-filter: blur(15px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 10px 32px; flex-shrink: 0; flex-wrap: wrap; gap: 10px; z-index: 5; }
  .progress-container { flex: 1; min-width: 200px; max-width: 500px; }
  .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .progress-bar { height: 8px; background: #162746; border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.5); }
  .progress-bar div { height: 100%; background: linear-gradient(90deg, #2987e7, var(--cyan)); border-radius: 99px; transition: width .5s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(74,184,255,.5); }
  
  .btn-quiz { background: linear-gradient(135deg, var(--gold), #ff9a5c); color: #000; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,184,119,.3); transition: .2s; display: flex; align-items: center; gap: 8px; }
  .btn-quiz:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,184,119,.5); }

  /* LESSON AREA */
  .content-scroll { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
  .lesson-wrapper { max-width: 800px; margin: 0 auto; background: linear-gradient(180deg, rgba(10,22,46,1) 0%, rgba(5,10,31,1) 100%); border: 1px solid var(--line); border-radius: 24px; padding: 48px; box-shadow: 0 20px 50px rgba(0,0,0,.3); position: relative; overflow: hidden; }
  .lesson-wrapper::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--cyan), var(--green)); }
  
  .lesson-tag { display: inline-block; background: rgba(74,184,255,.1); color: var(--cyan); padding: 6px 12px; border-radius: 100px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 20px; }
  .lesson-wrapper h1 { font-size: 36px; margin: 0 0 24px; letter-spacing: -.03em; line-height: 1.2; }
  .lesson-wrapper p { color: #c8d8e8; font-size: 17px; line-height: 1.8; margin-bottom: 24px; }
  .lesson-wrapper img { width: 100%; height: 300px; object-fit: cover; border-radius: 16px; margin-bottom: 24px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  
  /* PRACTICAL EXAMPLE BLOCK */
  .practical-block { background: rgba(114, 226, 192, 0.05); border-left: 4px solid var(--green); padding: 24px; border-radius: 0 16px 16px 0; margin: 30px 0; }
  .practical-block h4 { color: var(--green); margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .practical-block p { margin: 0; color: #b8cfe4; font-size: 15px; }

  .lesson-nav { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); gap: 15px; }
  .btn { padding: 14px 28px; border-radius: 10px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 1; }
  .btn-primary { background: var(--cyan); color: #041326; box-shadow: 0 4px 15px rgba(74,184,255,.3); }
  .btn-primary:hover { background: #89dcff; transform: translateY(-2px); }
  .btn-ghost { background: rgba(255,255,255,.05); color: #fff; border: 1px solid var(--line); }
  .btn-ghost:hover { background: rgba(255,255,255,.1); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* QUIZ MODAL */
  #quizModal { position: fixed; inset: 0; background: rgba(5,10,31,.98); backdrop-filter: blur(25px); z-index: 100; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
  #quizModal.active { display: flex; }
  .quiz-card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; width: 100%; max-width: 750px; padding: 40px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .quiz-header { margin-bottom: 40px; text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
  .quiz-header h2 { font-size: 28px; margin: 0 0 10px; color: #fff; }
  .quiz-header p { color: var(--muted); margin: 0; font-size: 15px; }
  
  .question { margin-bottom: 30px; background: rgba(255,255,255,.02); padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,.05); }
  .question p { font-weight: 600; font-size: 17px; margin-bottom: 16px; color: #fff; }
  .option { display: flex; align-items: center; gap: 14px; padding: 16px; border: 2px solid transparent; background: rgba(0,0,0,.3); border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: .2s; font-size: 15px; }
  .option:hover { background: rgba(74,184,255,.08); border-color: rgba(74,184,255,.3); }
  .option input { accent-color: var(--cyan); width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
  .option.selected { border-color: var(--cyan); background: rgba(74,184,255,.15); }
  
  .quiz-footer { text-align: center; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 30px; }
  .quiz-footer .btn { width: 100%; max-width: 300px; font-size: 16px; padding: 16px; }

  /* ANTI-CHEAT WARNING */
  #cheatWarning { position: fixed; inset: 0; background: rgba(200,20,20,.98); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 40px; }
  #cheatWarning h1 { font-size: clamp(30px, 5vw, 50px); margin: 0 0 20px; font-weight: 800; }
  #cheatWarning p { font-size: clamp(16px, 2vw, 20px); max-width: 600px; line-height: 1.6; opacity: .9; }

  /* RESPONSIVE */
  @media (max-width: 800px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); width: 280px; z-index: 50; box-shadow: 20px 0 50px rgba(0,0,0,.5); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .lesson-wrapper { padding: 24px; border-radius: 16px; }
    .content-scroll { padding: 20px; }
    .topbar { padding: 15px 20px; }
    .mobile-menu-btn { display: block !important; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: #fff; font-size: 20px; cursor: pointer; padding: 8px 12px; border-radius: 8px; margin-right: 15px; }
    .lesson-wrapper h1 { font-size: 28px; }
    .lesson-wrapper img { height: 200px; }
    .btn-quiz { width: 100%; justify-content: center; margin-top: 15px; }
    .progress-container { width: 100%; max-width: none; flex: 100%; order: 3; margin-top: 10px; }
    .quiz-card { padding: 24px; border-radius: 16px; }
    .lesson-nav { flex-direction: column-reverse; }
  }
</style>
</head>

    'computer-basics': {

      modules: [

      modules: [

          lessons: [
            { id: 'fa-m1-l1', title: 'The Primary Survey', content: `

      quiz: [

  // ============================================================
  // STATE & LOGIC
  // ============================================================
  let state = {
    user: null,
    userData: null,
    currentCourseId: null,
    currentLessonIndex: 0,
    flatLessons: [],
    isQuizOpen: false,
    quizAttempt: null
  };

  const urlParams = new URLSearchParams(window.location.search);
  state.currentCourseId = urlParams.get('course') || 'excel-advanced';
  const startLesson = parseInt(urlParams.get('lesson')) || 0;

  // Auth Guard
  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    state.user = user;
    
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      state.userData = snap.exists() ? snap.data() : { progress: {}, purchasedCourses: [] };
    } catch (e) {
      // Fallback to localStorage if offline
      const local = localStorage.getItem(`progress_${user.uid}`);
      state.userData = local ? JSON.parse(local) : { progress: {}, purchasedCourses: [] };
    }
    
    initCourse();
    state.currentLessonIndex = Math.min(startLesson, state.flatLessons.length - 1);
    renderSidebar();
    renderLesson();
    setupAntiCheat();
  });

  function initCourse() {
    const course = COURSE_DATA[state.currentCourseId];
    if (!course) { alert('Course not found'); window.location.href='dashboard.html'; return; }
    state.flatLessons = [];
    course.modules.forEach(m => {
      m.lessons.forEach(l => {
        state.flatLessons.push(l);
      });
    });
    document.title = `${course.title} · Learning`;
  }

  function getProgress() {
    const p = state.userData.progress?.[state.currentCourseId] || { completedLessons: [] };
    const total = state.flatLessons.length;
    const done = p.completedLessons?.length || 0;
    const pct = Math.round((done / total) * 100) || 0;
    return { p, total, done, pct };
  }

  // ============================================================
  // RENDERERS
  // ============================================================
  function renderSidebar() {
    const course = COURSE_DATA[state.currentCourseId];
    const { p } = getProgress();
    let html = '';
    
    course.modules.forEach((mod) => {
      html += `<div class="module-title">${mod.title}</div>`;
      mod.lessons.forEach((lesson) => {
        const globalIdx = state.flatLessons.findIndex(l => l.id === lesson.id);
        const isCompleted = p.completedLessons?.includes(lesson.id);
        const isActive = globalIdx === state.currentLessonIndex;
        
        html += `
          <a class="lesson-link ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" onclick="goToLesson(${globalIdx})">
            <span class="icon">${isCompleted ? '✓' : globalIdx + 1}</span>
            <span>${lesson.title}</span>
          </a>
        `;
      });
    });
    
    document.getElementById('syllabusList').innerHTML = html;
  }

  function renderLesson() {
    const lesson = state.flatLessons[state.currentLessonIndex];
    if (!lesson) return;

    const { done, total, pct } = getProgress();
    document.getElementById('progressPercent').textContent = `${pct}%`;
    document.getElementById('progressFill').style.width = `${pct}%`;
    document.getElementById('progressLabel').textContent = `${done} of ${total} lessons done`;

    const container = document.getElementById('lessonContent');
    let contentHtml = lesson.content;
    
    const isFirst = state.currentLessonIndex === 0;
    const isLast = state.currentLessonIndex === state.flatLessons.length - 1;
    const p = state.userData.progress?.[state.currentCourseId] || { completedLessons: [] };
    const isCompleted = p.completedLessons?.includes(lesson.id);

    contentHtml += `
      <div class="lesson-nav">
        <button class="btn btn-ghost" onclick="prevLesson()" ${isFirst ? 'disabled' : ''}>← Previous</button>
        ${!isCompleted 
          ? `<button class="btn btn-primary" onclick="markComplete()">Complete & Continue →</button>`
          : `<button class="btn btn-primary" onclick="nextLesson()" ${isLast ? 'disabled' : ''}>Next Lesson →</button>`
        }
      </div>
    `;
    
    container.innerHTML = contentHtml;

    const course = COURSE_DATA[state.currentCourseId];
    if (done === total && course.quiz) {
      document.getElementById('takeQuizBtn').style.display = 'flex';
    } else {
      document.getElementById('takeQuizBtn').style.display = 'none';
    }
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  window.goToLesson = function(index) {
    state.currentLessonIndex = index;
    renderSidebar();
    renderLesson();
    document.querySelector('.content-scroll').scrollTo(0, 0);
    if (window.innerWidth < 800) document.getElementById('sidebar').classList.remove('open');
  };

  window.nextLesson = function() {
    if (state.currentLessonIndex < state.flatLessons.length - 1) goToLesson(state.currentLessonIndex + 1);
  };

  window.prevLesson = function() {
    if (state.currentLessonIndex > 0) goToLesson(state.currentLessonIndex - 1);
  };

  window.markComplete = async function() {
    const lesson = state.flatLessons[state.currentLessonIndex];
    if (!lesson) return;

    if (!state.userData.progress) state.userData.progress = {};
    if (!state.userData.progress[state.currentCourseId]) state.userData.progress[state.currentCourseId] = { completedLessons: [] };
    
    const p = state.userData.progress[state.currentCourseId];
    if (!p.completedLessons.includes(lesson.id)) p.completedLessons.push(lesson.id);
    p.lastAccessedAt = new Date().toISOString();
    p.lastLessonIndex = state.currentLessonIndex;

    // Save locally instantly (so it doesn't feel slow)
    localStorage.setItem(`progress_${state.user.uid}`, JSON.stringify(state.userData));

    renderSidebar();
    renderLesson();

    try {
      const userRef = doc(db, 'users', state.user.uid);
      await updateDoc(userRef, { [`progress.${state.currentCourseId}`]: p });
      await addDoc(collection(db, 'activity'), {
        uid: state.user.uid,
        type: 'lesson_completed',
        courseId: state.currentCourseId,
        courseTitle: COURSE_DATA[state.currentCourseId].title,
        at: serverTimestamp()
      });
    } catch(e) {
      console.warn("Could not sync to Firestore, saved locally.");
    }

    if (state.currentLessonIndex < state.flatLessons.length - 1) {
      setTimeout(() => nextLesson(), 300);
    }
  };

  // ============================================================
  // QUIZ SYSTEM (ANTI-CHEAT)
  // ============================================================
  window.openQuiz = function() {
    const course = COURSE_DATA[state.currentCourseId];
    if (!course.quiz) return;

    state.isQuizOpen = true;
    state.quizAttempt = {
      answers: new Array(course.quiz.length).fill(null),
      shuffledQuestions: [...course.quiz].sort(() => Math.random() - 0.5)
    };

    const modal = document.getElementById('quizModal');
    const card = document.getElementById('quizCard');
    
    let html = `
      <div class="quiz-header">
        <h2>Final Assessment</h2>
        <p>Answer all questions. Do not switch tabs.</p>
      </div>
    `;

    state.quizAttempt.shuffledQuestions.forEach((q, qIdx) => {
      html += `
        <div class="question" id="q-block-${qIdx}">
          <p>${qIdx + 1}. ${q.q}</p>
          ${q.options.map((opt, oIdx) => `
            <label class="option" id="opt-${qIdx}-${oIdx}">
              <input type="radio" name="q${qIdx}" value="${oIdx}" onchange="recordAnswer(${qIdx}, ${oIdx})">
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
      `;
    });

    html += `
      <div class="quiz-footer">
        <button class="btn btn-primary" onclick="submitQuiz()">Submit Quiz</button>
      </div>
    `;

    card.innerHTML = html;
    modal.classList.add('active');

    // ANTI-CHEAT
    document.addEventListener('visibilitychange', checkVisibility);
    window.addEventListener('blur', antiCheatTrigger); // Fallback for desktop
  };

  window.recordAnswer = function(qIdx, oIdx) {
    if (!state.quizAttempt) return;
    state.quizAttempt.answers[qIdx] = oIdx;
    
    // Highlight selected
    const container = document.getElementById(`q-block-${qIdx}`);
    container.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${qIdx}-${oIdx}`).classList.add('selected');
  };

  function antiCheatTrigger() {
    if (!state.isQuizOpen) return;
    document.getElementById('cheatWarning').style.display = 'flex';
    state.isQuizOpen = false; 
    document.getElementById('quizModal').classList.remove('active');
    document.removeEventListener('visibilitychange', checkVisibility);
  }

  function checkVisibility() {
    if (document.hidden) antiCheatTrigger();
  }

  window.resetQuizState = function() {
    document.getElementById('cheatWarning').style.display = 'none';
    alert("Attempt forfeited. Please review the lessons and try again later.");
    window.location.reload();
  };

  window.submitQuiz = function() {
    if (state.quizAttempt.answers.includes(null)) {
      alert("Please answer all questions before submitting.");
      return;
    }

    document.removeEventListener('visibilitychange', checkVisibility);
    window.removeEventListener('blur', antiCheatTrigger);

    let correct = 0;
    state.quizAttempt.shuffledQuestions.forEach((q, idx) => {
      if (state.quizAttempt.answers[idx] === q.correct) correct++;
    });

    const score = Math.round((correct / state.quizAttempt.shuffledQuestions.length) * 100);
    
    const card = document.getElementById('quizCard');
    card.innerHTML = `
      <div style="text-align:center; padding: 40px 0;">
        <h1 style="font-size:64px; color:${score >= 70 ? 'var(--green)' : '#ff8888'}; margin-bottom:10px;">${score}%</h1>
        <h2>${score >= 70 ? 'Congratulations!' : 'Keep practicing!'}</h2>
        <p style="color:var(--muted); margin-bottom:30px;">You got ${correct} out of ${state.quizAttempt.shuffledQuestions.length} questions correct.</p>
        <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">Return to Dashboard</button>
      </div>
    `;

    if (score >= 70) {
      // Update quiz pass in Firestore
      const userRef = doc(db, 'users', state.user.uid);
      const p = state.userData.progress[state.currentCourseId];
      p.quizzesPassed = (p.quizzesPassed || 0) + 1;
      updateDoc(userRef, { [`progress.${state.currentCourseId}`]: p });
    }
  };

  // Mobile sidebar toggles
  if (window.innerWidth <= 800) {
    document.querySelectorAll('.mobile-menu-btn').forEach(btn => btn.style.display = 'block');
  }
</script>
