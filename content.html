<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Learning · ISHURI ONLINE</title>
<link rel="icon" href="https://i.postimg.cc/tT3Myvhj/ISHURI-Online-Learning-Logo.png">
<style>
  /* ============================================================
     PREMIUM DESIGN SYSTEM
     ============================================================ */
  :root { 
    color-scheme: dark; 
    --bg: #030816; 
    --panel: rgba(13, 25, 53, 0.8); 
    --line: rgba(105, 170, 231, 0.15); 
    --text: #ffffff; 
    --muted: #8da4c1; 
    --cyan: #4ab8ff; 
    --violet: #8a5cff;
    --green: #00e5a0;
    --gold: #ffb800;
    --pink: #ff5e8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif; display: flex; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
  
  /* Floating Background Orbs */
  .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .orb { position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.3; }
  .orb-1 { width: 500px; height: 500px; background: var(--violet); top: -150px; left: -150px; }
  .orb-2 { width: 400px; height: 400px; background: var(--cyan); bottom: -100px; right: -100px; }

  /* ============================================================
     SIDEBAR (SYLLABUS)
     ============================================================ */
  .sidebar { width: 340px; background: rgba(3, 8, 22, 0.9); backdrop-filter: blur(30px); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 50; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  .sidebar.open { transform: translateX(0); }
  
  .sidebar-header { padding: 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 800; letter-spacing: .1em; font-size: 14px; }
  .brand img { width: 32px; filter: drop-shadow(0 0 10px rgba(74,184,255,0.5)); }
  
  .syllabus { flex: 1; overflow-y: auto; padding: 20px; }
  .syllabus::-webkit-scrollbar { width: 6px; }
  .syllabus::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  
  .module-group { margin-bottom: 24px; }
  .module-header { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .module-header .lock-icon { color: var(--muted); font-size: 14px; }
  .module-header.unlocked .lock-icon { color: var(--green); }

  .lesson-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 6px; transition: .2s; cursor: pointer; border: 1px solid transparent; background: rgba(255,255,255,0.02); }
  .lesson-link:hover:not(.locked) { background: rgba(74,184,255,.08); color: #fff; }
  .lesson-link.active { background: rgba(74,184,255,.15); color: #fff; border-color: rgba(74,184,255,.4); font-weight: 600; }
  .lesson-link.completed .icon { background: var(--green); color: #041326; border-color: var(--green); }
  .lesson-link.locked { opacity: 0.5; cursor: not-allowed; }
  
  .icon { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; border: 1px solid var(--line); flex-shrink: 0; transition: .2s; }
  .lesson-link.active .icon { border-color: var(--cyan); background: var(--cyan); color: #041326; }
  
  .quiz-link { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-top: 12px; cursor: pointer; transition: 0.2s; border: 1px dashed rgba(255,184,0,0.4); background: rgba(255,184,0,0.05); color: var(--gold); }
  .quiz-link:hover:not(.locked) { background: rgba(255,184,0,0.1); }
  .quiz-link.passed { border-style: solid; border-color: var(--green); background: rgba(0,229,160,0.1); color: var(--green); }
  .quiz-link.locked { opacity: 0.5; cursor: not-allowed; border-color: var(--line); color: var(--muted); background: transparent; }

  .cert-btn { margin-top: 30px; width: 100%; padding: 16px; border-radius: 12px; background: linear-gradient(135deg, var(--gold), #ff8a00); color: #000; font-weight: 800; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 30px rgba(255,184,0,0.3); transition: 0.2s; }
  .cert-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(255,184,0,0.5); }

  /* ============================================================
     MAIN CONTENT
     ============================================================ */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
  
  .topbar { min-height: 70px; background: rgba(3,8,22,.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 10px 40px; flex-shrink: 0; gap: 20px; z-index: 10; }
  .progress-container { flex: 1; max-width: 400px; }
  .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .progress-bar { height: 8px; background: rgba(0,0,0,.4); border-radius: 99px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.5); }
  .progress-bar div { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--violet)); border-radius: 99px; transition: width .5s ease; box-shadow: 0 0 10px rgba(74,184,255,.5); }
  
  .mobile-menu-btn { display: none; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: #fff; font-size: 20px; cursor: pointer; padding: 8px 12px; border-radius: 8px; }

  .content-scroll { flex: 1; overflow-y: auto; padding: 40px; scroll-behavior: smooth; }
  .lesson-wrapper { max-width: 850px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 50px; box-shadow: 0 20px 50px rgba(0,0,0,.3); position: relative; overflow: hidden; }
  
  .lesson-tag { display: inline-block; background: rgba(138,92,255,.15); color: var(--violet); padding: 6px 14px; border-radius: 100px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 24px; }
  .lesson-wrapper h1 { font-size: 38px; margin: 0 0 24px; letter-spacing: -.03em; line-height: 1.2; color: #fff; }
  .lesson-wrapper p { color: #cbd5e1; font-size: 17px; line-height: 1.8; margin-bottom: 24px; }
  .lesson-wrapper img { width: 100%; height: 350px; object-fit: cover; border-radius: 16px; margin-bottom: 30px; border: 1px solid var(--line); box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  
  .practical-block { background: rgba(0, 229, 160, 0.05); border-left: 4px solid var(--green); padding: 24px; border-radius: 0 16px 16px 0; margin: 30px 0; }
  .practical-block h4 { color: var(--green); margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .practical-block p { margin: 0; color: #cbd5e1; font-size: 15px; }

  .lesson-nav { display: flex; justify-content: space-between; margin-top: 50px; padding-top: 30px; border-top: 1px solid var(--line); gap: 20px; }
  .btn { padding: 16px 32px; border-radius: 12px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; transition: .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 1; }
  .btn-primary { background: var(--cyan); color: #041326; box-shadow: 0 4px 15px rgba(74,184,255,.3); }
  .btn-primary:hover:not(:disabled) { background: #89dcff; transform: translateY(-2px); }
  .btn-ghost { background: rgba(255,255,255,.05); color: #fff; border: 1px solid var(--line); }
  .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,.1); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* ============================================================
     QUIZ MODAL
     ============================================================ */
  #quizModal { position: fixed; inset: 0; background: rgba(3,8,22,.98); backdrop-filter: blur(25px); z-index: 100; display: none; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
  #quizModal.active { display: flex; }
  .quiz-card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; width: 100%; max-width: 750px; padding: 40px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .quiz-header { margin-bottom: 40px; text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
  .quiz-header h2 { font-size: 28px; margin: 0 0 10px; color: #fff; }
  .quiz-header p { color: var(--muted); margin: 0; font-size: 15px; }
  
  .question { margin-bottom: 30px; background: rgba(255,255,255,.02); padding: 24px; border-radius: 16px; border: 1px solid rgba(255,255,255,.05); }
  .question p { font-weight: 600; font-size: 17px; margin-bottom: 16px; color: #fff; }
  .option { display: flex; align-items: center; gap: 14px; padding: 16px; border: 2px solid transparent; background: rgba(0,0,0,.3); border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: .2s; font-size: 15px; }
  .option:hover { background: rgba(74,184,255,.08); border-color: rgba(74,184,255,.3); }
  .option input { accent-color: var(--cyan); width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; }
  .option.selected { border-color: var(--cyan); background: rgba(74,184,255,.15); }
  
  .quiz-footer { text-align: center; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 30px; }
  .quiz-footer .btn { width: 100%; max-width: 300px; font-size: 16px; padding: 18px; }

  /* ANTI-CHEAT WARNING */
  #cheatWarning { position: fixed; inset: 0; background: rgba(200,20,20,.98); z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 40px; }
  #cheatWarning h1 { font-size: clamp(30px, 5vw, 50px); margin: 0 0 20px; font-weight: 800; }
  #cheatWarning p { font-size: clamp(16px, 2vw, 20px); max-width: 600px; line-height: 1.6; opacity: .9; }

  /* ============================================================
     CERTIFICATE MODAL
     ============================================================ */
  #certModal { position: fixed; inset: 0; background: rgba(3,8,22,.95); backdrop-filter: blur(20px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
  #certModal.active { display: flex; }
  .certificate { width: 100%; max-width: 900px; background: #fff; color: #1a1a1a; padding: 60px; border-radius: 10px; position: relative; text-align: center; box-shadow: 0 30px 100px rgba(0,0,0,.5); border: 15px solid #0a162e; outline: 2px solid var(--gold); outline-offset: -25px; }
  .cert-logo { width: 60px; margin-bottom: 20px; }
  .cert-title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.3em; color: #666; margin-bottom: 10px; font-weight: 700; }
  .cert-course { font-size: 36px; font-weight: 800; color: #0a162e; margin-bottom: 30px; font-family: Georgia, serif; }
  .cert-text { font-size: 18px; color: #444; margin-bottom: 10px; }
  .cert-name { font-size: 42px; font-weight: 700; color: var(--violet); margin-bottom: 30px; border-bottom: 2px solid #eee; display: inline-block; padding: 0 40px 10px; font-family: Georgia, serif; }
  .cert-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 60px; }
  .cert-sign { text-align: center; }
  .cert-sign-line { width: 200px; border-bottom: 1px solid #444; margin-bottom: 8px; }
  .cert-sign p { margin: 0; font-size: 14px; font-weight: 600; }
  .cert-actions { margin-top: 30px; display: flex; gap: 10px; justify-content: center; }
  .btn-cert { padding: 14px 28px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; font-size: 14px; }
  .btn-print { background: #0a162e; color: white; }
  .btn-close { background: #eee; color: #333; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 850px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; transform: translateX(-100%); width: 300px; }
    .main { margin-left: 0; }
    .lesson-wrapper { padding: 30px; border-radius: 16px; }
    .content-scroll { padding: 20px; }
    .topbar { padding: 15px 20px; }
    .mobile-menu-btn { display: block; }
    .lesson-wrapper h1 { font-size: 28px; }
    .lesson-wrapper img { height: 200px; }
    .lesson-nav { flex-direction: column-reverse; }
    .certificate { padding: 30px; border-width: 8px; }
    .cert-course { font-size: 24px; }
    .cert-name { font-size: 28px; }
    .cert-footer { flex-direction: column; align-items: center; gap: 30px; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
</div>

<!-- ANTI-CHEAT WARNING -->
<div id="cheatWarning">
  <h1>⚠️ Quiz Locked</h1>
  <p>You navigated away from the quiz tab. To maintain academic integrity, this attempt has been locked and reset. Please stay on this page during the quiz.</p>
  <button class="btn btn-primary" style="margin-top:20px; flex:none;" onclick="resetQuizState()">Return to Lesson</button>
</div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <a href="dashboard.html" class="brand">
      <img src="https://i.postimg.cc/tT3Myvhj/ISHURI-Online-Learning-Logo.png" alt="">
      <span>ISHURI</span>
    </a>
    <button class="mobile-menu-btn" style="display:none;" onclick="document.getElementById('sidebar').classList.remove('open')">✕</button>
  </div>
  <div class="syllabus" id="syllabusList">
    <!-- Syllabus Injected Here -->
  </div>
</aside>

<!-- MAIN AREA -->
<main class="main">
  <header class="topbar">
    <button class="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.add('open')">☰</button>
    
    <div class="progress-container">
      <div class="progress-text">
        <span id="progressLabel">Course Progress</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <div class="content-scroll" id="contentScroll">
    <div class="lesson-wrapper" id="lessonContent">
      <!-- Lesson Content Injected Here -->
    </div>
  </div>
</main>

<!-- QUIZ MODAL -->
<div id="quizModal">
  <div class="quiz-card" id="quizCard">
    <!-- Quiz Injected Here -->
  </div>
</div>

<!-- CERTIFICATE MODAL -->
<div id="certModal">
  <div class="certificate" id="certificateContent">
    <!-- Certificate Injected Here -->
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, doc, getDoc, updateDoc, serverTimestamp, addDoc, collection } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  const firebaseConfig = { apiKey: "AIzaSyAlecssz7iDdq_h4IhVo1HKlj-MpRa3CCs", authDomain: "ishuri-online.firebaseapp.com", projectId: "ishuri-online", storageBucket: "ishuri-online.firebasestorage.app", messagingSenderId: "910778726579", appId: "1:910778726579:web:2c49c3882dcc04a48cd8c6" };
  const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);

  // ============================================================
  // DATA GENERATOR (Creates 5 rich modules for all 14 courses)
  // ============================================================
  const generateCourse = (id, title, cat) => {
    const images = {
      tech: ['https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=1000&q=80'],
      business: ['https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1556761175-5973dc0f32e7?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1432888622747-4eb9a8efeb07?auto=format&fit=crop&w=1000&q=80'],
      career: ['https://images.unsplash.com/photo-1586281380349-632531db7ed4?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=1000&q=80'],
      life: ['https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1579621970563-ebec7560ff3e?auto=format&fit=crop&w=1000&q=80', 'https://images.unsplash.com/photo-1499209974431-9dddcece7f88?auto=format&fit=crop&w=1000&q=80']
    };
    const imgPool = images[cat] || images.tech;
    
    const modules = [];
    for (let i = 1; i <= 5; i++) {
      modules.push({
        id: `mod-${i}`,
        title: `Module ${i}: ${title.split(' ')[0]} Fundamentals ${i}`,
        lessons: [
          {
            id: `m${i}-l1`,
            title: `Introduction to Module ${i}`,
            content: `
              <div class="lesson-tag">Module ${i} • Lesson 1</div>
              <h1>Introduction to ${title}</h1>
              <p>Welcome to Module ${i}. In this section, we will explore the core principles that make ${title} so powerful in the real world. Understanding these basics is crucial before moving to advanced techniques.</p>
              <img src="${imgPool[i % imgPool.length]}" alt="${title}">
              <div class="practical-block">
                <h4>💡 Real-World Application</h4>
                <p>Professionals use these exact concepts daily. For example, mastering this specific step allows you to save up to 40% of your time when working on complex projects.</p>
              </div>
              <p>Let's dive deep into the theoretical framework and how it applies to modern workflows.</p>
            `
          },
          {
            id: `m${i}-l2`,
            title: `Practical Application ${i}`,
            content: `
              <div class="lesson-tag">Module ${i} • Lesson 2</div>
              <h1>Hands-on Practice</h1>
              <p>Now that you understand the theory, it's time to apply it. Follow the steps below to build your first practical example.</p>
              <img src="${imgPool[(i+1) % imgPool.length]}" alt="Practical Example">
              <div class="practical-block">
                <h4>🛠️ Step-by-Step Guide</h4>
                <p>1. Open your workspace.<br>2. Apply the technique discussed in the previous lesson.<br>3. Analyze the output to ensure accuracy.<br>4. Save your work and prepare for the module assessment.</p>
              </div>
            `
          }
        ],
        quiz: [
          { q: `What is the main focus of Module ${i}?`, options: ['Advanced theories', `${title} Fundamentals`, 'Hardware', 'None of the above'], correct: 1 },
          { q: 'Why is this module important?', options: ['It builds the foundation', 'It is optional', 'It is just for fun', 'It is the final test'], correct: 0 },
          { q: 'Have you completed the practical exercise?', options: ['Yes', 'No'], correct: 0 }
        ]
      });
    }

    return { id, title, modules, certificate: { title: 'Certificate of Completion', course: title } };
  };

  // Generate 14 Courses
  const COURSE_DATA = {
    'excel-advanced': generateCourse('excel-advanced', 'Advanced Microsoft Excel', 'tech'),
    'word': generateCourse('word', 'Microsoft Word', 'tech'),
    'powerpoint': generateCourse('powerpoint', 'Microsoft PowerPoint', 'tech'),
    'google-workspace': generateCourse('google-workspace', 'Google Workspace', 'tech'),
    'powerbi': generateCourse('powerbi', 'Power BI & Data Analysis', 'tech'),
    'accounting': generateCourse('accounting', 'Accounting & Bookkeeping', 'business'),
    'personal-finance': generateCourse('personal-finance', 'Personal Finance & Budgeting', 'business'),
    'entrepreneurship': generateCourse('entrepreneurship', 'Entrepreneurship & Business Planning', 'business'),
    'digital-marketing': generateCourse('digital-marketing', 'Digital Marketing', 'business'),
    'network-marketing': generateCourse('network-marketing', 'Network Marketing & MLM', 'business'),
    'cv-writing': generateCourse('cv-writing', 'CV Writing & Job Readiness', 'career'),
    'ai-work': generateCourse('ai-work', 'AI for Everyday Work', 'career'),
    'computer-basics': generateCourse('computer-basics', 'Computer Basics & Digital Literacy', 'career'),
    'first-aid': generateCourse('first-aid', 'Basic First Aid & Personal Safety', 'life')
  };

  // ============================================================
  // STATE & LOGIC
  // ============================================================
  let state = {
    user: null,
    userData: null,
    currentCourseId: null,
    flatLessons: [],
    currentLessonIndex: 0,
    isQuizOpen: false,
    currentQuizModule: null,
    quizAttempt: null
  };

  const urlParams = new URLSearchParams(window.location.search);
  state.currentCourseId = urlParams.get('course') || 'excel-advanced';
  const startLesson = parseInt(urlParams.get('lesson')) || 0;

  onAuthStateChanged(auth, async (user) => {
    if (!user) { window.location.href = 'index.html'; return; }
    state.user = user;
    
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      state.userData = snap.exists() ? snap.data() : { progress: {}, purchasedCourses: [] };
    } catch (e) {
      const local = localStorage.getItem(`progress_${user.uid}`);
      state.userData = local ? JSON.parse(local) : { progress: {}, purchasedCourses: [] };
    }
    
    initCourse();
    state.currentLessonIndex = Math.min(startLesson, state.flatLessons.length - 1);
    renderSidebar();
    renderLesson();
    setupAntiCheat();
  });

  function initCourse() {
    const course = COURSE_DATA[state.currentCourseId];
    if (!course) { alert('Course not found'); window.location.href='dashboard.html'; return; }
    state.flatLessons = [];
    course.modules.forEach(m => {
      m.lessons.forEach(l => {
        state.flatLessons.push({...l, moduleId: m.id, moduleIndex: course.modules.indexOf(m)});
      });
    });
    document.title = `${course.title} · Learning`;
  }

  function getProgress() {
    const p = state.userData.progress?.[state.currentCourseId] || { completedLessons: [], passedQuizzes: [] };
    return { 
      completedLessons: Array.isArray(p.completedLessons) ? p.completedLessons : [], 
      passedQuizzes: Array.isArray(p.passedQuizzes) ? p.passedQuizzes : [] 
    };
  }

  function isModuleUnlocked(modIndex) {
    if (modIndex === 0) return true;
    const course = COURSE_DATA[state.currentCourseId];
    const prevModId = course.modules[modIndex - 1].id;
    return getProgress().passedQuizzes.includes(prevModId);
  }

  // ============================================================
  // RENDERERS
  // ============================================================
  function renderSidebar() {
    const course = COURSE_DATA[state.currentCourseId];
    const p = getProgress();
    let html = '';
    
    course.modules.forEach((mod, mIdx) => {
      const unlocked = isModuleUnlocked(mIdx);
      const quizPassed = p.passedQuizzes.includes(mod.id);
      
      html += `<div class="module-group">`;
      html += `<div class="module-header ${unlocked ? 'unlocked' : ''}">${mod.title} <span class="lock-icon">${unlocked ? '🔓' : '🔒'}</span></div>`;
      
      mod.lessons.forEach(lesson => {
        const globalIdx = state.flatLessons.findIndex(l => l.id === lesson.id);
        const isCompleted = p.completedLessons.includes(lesson.id);
        const isActive = globalIdx === state.currentLessonIndex;
        
        html += `
          <a class="lesson-link ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''} ${!unlocked ? 'locked' : ''}" 
             onclick="${unlocked ? `goToLesson(${globalIdx})` : ''}">
            <span class="icon">${isCompleted ? '✓' : globalIdx + 1}</span>
            <span>${lesson.title}</span>
          </a>
        `;
      });
      
      // Quiz Link
      const allLessonsDone = mod.lessons.every(l => p.completedLessons.includes(l.id));
      const quizUnlocked = unlocked && allLessonsDone;
      html += `
        <div class="quiz-link ${quizPassed ? 'passed' : ''} ${!quizUnlocked ? 'locked' : ''}" 
             onclick="${quizUnlocked && !quizPassed ? `openQuiz(${mIdx})` : ''}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          ${quizPassed ? 'Assessment Passed' : quizUnlocked ? 'Take Module Quiz' : 'Quiz Locked'}
        </div>
      `;
      html += `</div>`;
    });
    
    // Certificate Button
    const allPassed = course.modules.every(m => p.passedQuizzes.includes(m.id));
    if (allPassed) {
      html += `<button class="cert-btn" onclick="showCertificate()">🏆 View Certificate</button>`;
    } else {
      html += `<button class="cert-btn" style="background:rgba(255,255,255,0.05); color:var(--muted); box-shadow:none; cursor:not-allowed; border:1px solid var(--line);" disabled>🔒 Pass all modules to unlock</button>`;
    }
    
    document.getElementById('syllabusList').innerHTML = html;
  }

  function renderLesson() {
    const lesson = state.flatLessons[state.currentLessonIndex];
    if (!lesson) return;

    const p = getProgress();
    const total = state.flatLessons.length;
    const done = p.completedLessons.length;
    const pct = Math.round((done / total) * 100);

    document.getElementById('progressPercent').textContent = `${pct}%`;
    document.getElementById('progressFill').style.width = `${pct}%`;
    document.getElementById('progressLabel').textContent = `${done} of ${total} lessons done`;

    const isFirst = state.currentLessonIndex === 0;
    const isLast = state.currentLessonIndex === state.flatLessons.length - 1;
    const isCompleted = p.completedLessons.includes(lesson.id);
    
    // Check if this is the last lesson of the module
    const course = COURSE_DATA[state.currentCourseId];
    const mod = course.modules[lesson.moduleIndex];
    const isLastInModule = mod.lessons[mod.lessons.length - 1].id === lesson.id;
    const quizPassed = p.passedQuizzes.includes(mod.id);

    let nextBtnHtml = '';
    if (isLast) {
      nextBtnHtml = `<button class="btn btn-primary" disabled>Course Complete</button>`;
    } else if (isLastInModule && !quizPassed) {
      nextBtnHtml = `<button class="btn btn-ghost" disabled>Pass Quiz to Unlock Next Module</button>`;
    } else if (isLastInModule && quizPassed) {
      nextBtnHtml = `<button class="btn btn-primary" onclick="nextLesson()">Go to Next Module →</button>`;
    } else {
      nextBtnHtml = `<button class="btn btn-primary" onclick="nextLesson()">Next Lesson →</button>`;
    }

    let contentHtml = lesson.content;
    contentHtml += `
      <div class="lesson-nav">
        <button class="btn btn-ghost" onclick="prevLesson()" ${isFirst ? 'disabled' : ''}>← Previous</button>
        ${!isCompleted 
          ? `<button class="btn btn-primary" onclick="markComplete()">Complete Lesson</button>`
          : nextBtnHtml
        }
      </div>
    `;
    
    document.getElementById('lessonContent').innerHTML = contentHtml;
    document.getElementById('contentScroll').scrollTo(0, 0);
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  window.goToLesson = function(index) {
    state.currentLessonIndex = index;
    renderSidebar();
    renderLesson();
    if (window.innerWidth < 850) document.getElementById('sidebar').classList.remove('open');
  };

  window.nextLesson = function() {
    if (state.currentLessonIndex < state.flatLessons.length - 1) goToLesson(state.currentLessonIndex + 1);
  };

  window.prevLesson = function() {
    if (state.currentLessonIndex > 0) goToLesson(state.currentLessonIndex - 1);
  };

  window.markComplete = async function() {
    const lesson = state.flatLessons[state.currentLessonIndex];
    if (!lesson) return;

    const p = getProgress();
    if (!p.completedLessons.includes(lesson.id)) p.completedLessons.push(lesson.id);
    p.lastAccessedAt = new Date().toISOString();
    p.lastLessonIndex = state.currentLessonIndex;

    state.userData.progress[state.currentCourseId] = p;
    localStorage.setItem(`progress_${state.user.uid}`, JSON.stringify(state.userData));

    renderSidebar();
    renderLesson();

    try {
      const userRef = doc(db, 'users', state.user.uid);
      await updateDoc(userRef, { [`progress.${state.currentCourseId}`]: p });
    } catch(e) {
      console.warn("Saved locally.");
    }
  };

  // ============================================================
  // QUIZ SYSTEM (MODULE SPECIFIC)
  // ============================================================
  window.openQuiz = function(moduleIndex) {
    const course = COURSE_DATA[state.currentCourseId];
    const mod = course.modules[moduleIndex];
    if (!mod.quiz) return;

    state.currentQuizModule = mod;
    state.isQuizOpen = true;
    state.quizAttempt = {
      answers: new Array(mod.quiz.length).fill(null),
      shuffledQuestions: [...mod.quiz].sort(() => Math.random() - 0.5)
    };

    const modal = document.getElementById('quizModal');
    const card = document.getElementById('quizCard');
    
    let html = `
      <div class="quiz-header">
        <h2>Module Assessment</h2>
        <p>${mod.title}</p>
        <p style="font-size:12px; color:var(--gold); margin-top:10px;">⚠️ Do not switch tabs or the quiz will lock.</p>
      </div>
    `;

    state.quizAttempt.shuffledQuestions.forEach((q, qIdx) => {
      html += `
        <div class="question" id="q-block-${qIdx}">
          <p>${qIdx + 1}. ${q.q}</p>
          ${q.options.map((opt, oIdx) => `
            <label class="option" id="opt-${qIdx}-${oIdx}">
              <input type="radio" name="q${qIdx}" value="${oIdx}" onchange="recordAnswer(${qIdx}, ${oIdx})">
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
      `;
    });

    html += `
      <div class="quiz-footer">
        <button class="btn btn-primary" onclick="submitQuiz()">Submit Assessment</button>
      </div>
    `;

    card.innerHTML = html;
    modal.classList.add('active');

    document.addEventListener('visibilitychange', checkVisibility);
    window.addEventListener('blur', antiCheatTrigger);
  };

  window.recordAnswer = function(qIdx, oIdx) {
    if (!state.quizAttempt) return;
    state.quizAttempt.answers[qIdx] = oIdx;
    const container = document.getElementById(`q-block-${qIdx}`);
    container.querySelectorAll('.option').forEach(el => el.classList.remove('selected'));
    document.getElementById(`opt-${qIdx}-${oIdx}`).classList.add('selected');
  };

  function antiCheatTrigger() {
    if (!state.isQuizOpen) return;
    document.getElementById('cheatWarning').style.display = 'flex';
    state.isQuizOpen = false; 
    document.getElementById('quizModal').classList.remove('active');
    document.removeEventListener('visibilitychange', checkVisibility);
    window.removeEventListener('blur', antiCheatTrigger);
  }

  function checkVisibility() {
    if (document.hidden) antiCheatTrigger();
  }

  window.resetQuizState = function() {
    document.getElementById('cheatWarning').style.display = 'none';
    alert("Attempt forfeited. Please review the lessons and try again.");
    window.location.reload();
  };

  window.submitQuiz = function() {
    if (state.quizAttempt.answers.includes(null)) {
      alert("Please answer all questions before submitting.");
      return;
    }

    document.removeEventListener('visibilitychange', checkVisibility);
    window.removeEventListener('blur', antiCheatTrigger);

    let correct = 0;
    state.quizAttempt.shuffledQuestions.forEach((q, idx) => {
      if (state.quizAttempt.answers[idx] === q.correct) correct++;
    });

    const score = Math.round((correct / state.quizAttempt.shuffledQuestions.length) * 100);
    
    const card = document.getElementById('quizCard');
    if (score >= 70) {
      card.innerHTML = `
        <div style="text-align:center; padding: 40px 0;">
          <h1 style="font-size:64px; color:var(--green); margin-bottom:10px;">${score}%</h1>
          <h2>Assessment Passed!</h2>
          <p style="color:var(--muted); margin-bottom:30px;">You answered ${correct} out of ${state.quizAttempt.shuffledQuestions.length} correctly.</p>
          <button class="btn btn-primary" onclick="closeQuizAndSave()">Continue Course</button>
        </div>
      `;
    } else {
      card.innerHTML = `
        <div style="text-align:center; padding: 40px 0;">
          <h1 style="font-size:64px; color:var(--pink); margin-bottom:10px;">${score}%</h1>
          <h2>Keep Practicing</h2>
          <p style="color:var(--muted); margin-bottom:30px;">You need 70% to pass. Review the module and try again.</p>
          <button class="btn btn-ghost" onclick="closeQuizAndSave()">Review Lessons</button>
        </div>
      `;
    }

    state.lastQuizScore = score;
  };

  window.closeQuizAndSave = async function() {
    document.getElementById('quizModal').classList.remove('active');
    state.isQuizOpen = false;

    if (state.lastQuizScore >= 70) {
      const p = getProgress();
      if (!p.passedQuizzes.includes(state.currentQuizModule.id)) {
        p.passedQuizzes.push(state.currentQuizModule.id);
      }
      state.userData.progress[state.currentCourseId] = p;
      localStorage.setItem(`progress_${state.user.uid}`, JSON.stringify(state.userData));
      
      try {
        const userRef = doc(db, 'users', state.user.uid);
        await updateDoc(userRef, { [`progress.${state.currentCourseId}`]: p });
        await addDoc(collection(db, 'activity'), {
          uid: state.user.uid, type: 'quiz_passed', courseId: state.currentCourseId, courseTitle: COURSE_DATA[state.currentCourseId].title, at: serverTimestamp()
        });
      } catch(e) {}

      renderSidebar();
      renderLesson();
      
      // Auto advance to next module's first lesson
      const currentModIdx = state.currentQuizModule ? COURSE_DATA[state.currentCourseId].modules.indexOf(state.currentQuizModule) : -1;
      if (currentModIdx >= 0 && currentModIdx < COURSE_DATA[state.currentCourseId].modules.length - 1) {
        const nextMod = COURSE_DATA[state.currentCourseId].modules[currentModIdx + 1];
        const nextGlobalIdx = state.flatLessons.findIndex(l => l.id === nextMod.lessons[0].id);
        goToLesson(nextGlobalIdx);
      }
    } else {
      // Failed - just reload the lesson view
      renderLesson();
    }
  };

  // ============================================================
  // CERTIFICATE LOGIC
  // ============================================================
  window.showCertificate = function() {
    const course = COURSE_DATA[state.currentCourseId];
    const date = new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).format(new Date());
    
    document.getElementById('certificateContent').innerHTML = `
      <img src="https://i.postimg.cc/tT3Myvhj/ISHURI-Online-Learning-Logo.png" class="cert-logo" alt="Logo">
      <div class="cert-title">Certificate of Completion</div>
      <div class="cert-course">${course.title}</div>
      <div class="cert-text">This is to certify that</div>
      <div class="cert-name">${state.user.displayName || 'Student'}</div>
      <div class="cert-text">has successfully completed all required modules, lessons, and assessments for this course.</div>
      
      <div class="cert-footer">
        <div class="cert-sign">
          <div class="cert-sign-line"></div>
          <p>Date: ${date}</p>
        </div>
        <div class="cert-sign">
          <div class="cert-sign-line"></div>
          <p>ISHURI ONLINE</p>
        </div>
      </div>
      
      <div class="cert-actions">
        <button class="btn-cert btn-print" onclick="window.print()">Download / Print</button>
        <button class="btn-cert btn-close" onclick="document.getElementById('certModal').classList.remove('active')">Close</button>
      </div>
    `;
    document.getElementById('certModal').classList.add('active');
  };
</script>
</body>
</html>
