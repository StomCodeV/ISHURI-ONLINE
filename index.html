<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ISHURI ONLINE · Atmosphere</title>
<style>
  html, body { margin:0; padding:0; background:#0a1a3a; overflow-x:hidden; font-family:system-ui,sans-serif; }
  #canvas-container { position:fixed; inset:0; z-index:0; pointer-events:none; }
  #scroll-space { position:relative; width:100%; height:800vh; z-index:1; pointer-events:none; opacity:0; }
  .webgl-fallback { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#020a1a; color:#a8c8e8; font-size:1rem; text-align:center; padding:2rem; z-index:10; }
  .webgl-fallback span { max-width:80%; line-height:1.7; }
  .loading-indicator { position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    color:#ffffff; text-shadow:0 1px 3px rgba(0,0,0,0.4);
    font-size:0.72rem; letter-spacing:0.4em; text-transform:uppercase;
    z-index:5; pointer-events:none; opacity:0.9; transition:opacity 1.2s; }
  .loading-indicator.hidden { opacity:0; }
  #vignette { position:fixed; inset:0; z-index:2; pointer-events:none;
    background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,5,20,0.55) 130%); }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="vignette"></div>
<div id="scroll-space"></div>
<div class="loading-indicator" id="loading-indicator">Loading atmosphere</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  maxPixelRatio: 2,
  bloomStrength: 0.55,
  bloomRadius: 0.75,
  bloomThreshold: 0.75,
  hexCount: 22,              // hexagon panels floating in scene
  nodeCount: 90,             // hex network nodes
  waveRibbonCount: 4,        // flowing wave ribbons
  dataDotClusters: 8,        // clusters of small dots
  techLineCount: 6,          // sky arcs
  reducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches
};
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if (isMobile) {
  CONFIG.maxPixelRatio = 1.5;
  CONFIG.hexCount = 14;
  CONFIG.nodeCount = 55;
  CONFIG.waveRibbonCount = 3;
  CONFIG.dataDotClusters = 5;
  CONFIG.techLineCount = 4;
}

// ============================================================
// STATE
// ============================================================
let scene, camera, renderer, composer;
const clock = new THREE.Clock();
let scrollProgress = 0, smoothScroll = 0, isPaused = false;
let time = 0, revealProgress = 0;

let skyMaterial;
let hexPanels = [];
let networkNodes = [];
let waveRibbons = [];
let dotClusters = [];
let techLines = [];
let cameraPath, lookAtPath, pathReady = false;

const PAL = {
  skyTop:     0x0a1a4a,
  skyMid:     0x1a3a7a,
  skyHorizon: 0x2a5a9a,
  skyDeep:    0x050e2a,
  hex:        new THREE.Color(0x4ab8ff),
  hexBright:  new THREE.Color(0x8ad8ff),
  hexDim:     new THREE.Color(0x2a70b8),
  node:       new THREE.Color(0x9ae0ff),
  wave:       new THREE.Color(0x5ac0ff),
  dot:        new THREE.Color(0x6ac8ff)
};

// ============================================================
// WEBGL CHECK
// ============================================================
function webglAvailable() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch(e) { return false; }
}
function showFallback(msg) {
  const c = document.getElementById('canvas-container'); c.innerHTML = '';
  const fb = document.createElement('div'); fb.className = 'webgl-fallback';
  fb.innerHTML = `<span>ISHURI ONLINE<br><br><small>${msg}</small></span>`;
  document.body.appendChild(fb);
}

// ============================================================
// SCENE INIT
// ============================================================
function initScene() {
  if (!webglAvailable()) { showFallback('WebGL not available.'); return false; }

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0a1a3a, 70, 420);

  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 2000);
  camera.position.set(0, 12, 60);

  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, CONFIG.maxPixelRatio));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    CONFIG.bloomStrength, CONFIG.bloomRadius, CONFIG.bloomThreshold
  ));
  const fxaa = new ShaderPass(FXAAShader);
  fxaa.uniforms.resolution.value.set(1/(innerWidth*renderer.getPixelRatio()), 1/(innerHeight*renderer.getPixelRatio()));
  composer.addPass(fxaa);
  scene.userData.fxaa = fxaa;

  buildSky();
  buildGround();
  buildHexPanels();
  buildNetwork();
  buildWaveRibbons();
  buildDotClusters();
  buildTechArcs();
  setupCameraPath();
  pathReady = true;
  return true;
}

// ============================================================
// SKY — deep tech atmosphere
// ============================================================
function buildSky() {
  const skyGeo = new THREE.SphereGeometry(900, 64, 48);
  skyMaterial = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      uTime:    { value: 0 },
      uTop:     { value: new THREE.Color(PAL.skyTop) },
      uMid:     { value: new THREE.Color(PAL.skyMid) },
      uHorizon: { value: new THREE.Color(PAL.skyHorizon) },
      uDeep:    { value: new THREE.Color(PAL.skyDeep) },
      uGlow:    { value: new THREE.Color(0x2a70c8) }
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vDir = normalize(wp.xyz);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uTop, uMid, uHorizon, uDeep, uGlow;
      varying vec3 vDir;

      float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      float noise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash(i), b = hash(i + vec2(1.0, 0.0));
        float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }
      float fbm(vec2 p){
        float v = 0.0, a = 0.5;
        for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
        return v;
      }

      void main() {
        vec3 dir = normalize(vDir);
        float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);

        // Vertical gradient — dark blue zenith → mid blue → cyan-ish horizon
        vec3 col = mix(uDeep, uHorizon, smoothstep(0.32, 0.55, h));
        col = mix(col, uMid, smoothstep(0.55, 0.78, h));
        col = mix(col, uTop, smoothstep(0.78, 1.0, h));

        // Central glow — bright blue "aurora-like" band near horizon center
        float centerX = 1.0 - abs(dir.x);
        float horizonBand = pow(1.0 - abs(dir.y), 12.0);
        float centerGlow = pow(centerX, 3.0) * horizonBand;
        col += uGlow * centerGlow * 0.7;

        // Soft haze cloud layer
        if (dir.y > 0.01) {
          float alt = 1.0 / max(dir.y, 0.008);
          vec2 uv = dir.xz * alt * 0.10 + vec2(uTime * 0.004, uTime * 0.0025);
          float clouds = fbm(uv);
          clouds = smoothstep(0.52, 0.78, clouds);
          float fade = smoothstep(0.01, 0.20, dir.y) * (1.0 - smoothstep(0.70, 1.0, dir.y));
          col = mix(col, col * 1.35 + vec3(0.10, 0.20, 0.35), clouds * 0.35 * fade);
        }

        // Vignette darkening at edges
        float v = smoothstep(0.0, 1.0, 1.0 - length(dir.xz) * 0.5);
        col *= 0.85 + v * 0.15;

        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const sky = new THREE.Mesh(skyGeo, skyMaterial);
  scene.add(sky);
}

// ============================================================
// GROUND — dark tech surface fading to horizon
// ============================================================
function buildGround() {
  const geo = new THREE.PlaneGeometry(3000, 3000, 80, 80);
  const pos = geo.attributes.position.array;
  const colors = new Float32Array(pos.length);
  const cDeep = new THREE.Color(0x050e28);
  const cNear = new THREE.Color(0x0a1a3a);
  const cHorizon = new THREE.Color(0x1a3a6a);

  for (let i = 0; i < pos.length; i += 3) {
    const x = pos[i], z = pos[i+2];
    const dist = Math.hypot(x, z);
    let y = Math.sin(x * 0.008) * 1.6 + Math.cos(z * 0.010) * 1.6;
    y += Math.sin(x * 0.03 + 1.3) * 0.4 + Math.cos(z * 0.026 + 0.7) * 0.4;
    pos[i+1] = y;

    let c = cNear.clone();
    const fade = Math.min(1, Math.max(0, (dist - 100) / 500));
    c.lerp(cHorizon, fade * 0.8);
    c.lerp(cDeep, Math.max(0, 1 - dist / 200) * 0.4);
    colors[i] = c.r; colors[i+1] = c.g; colors[i+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.85,
    metalness: 0.35,
    emissive: new THREE.Color(0x0a1a3a),
    emissiveIntensity: 0.4
  });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2;
  scene.add(ground);

  scene.add(new THREE.HemisphereLight(0x4a80c8, 0x0a1028, 0.8));
  scene.add(new THREE.AmbientLight(0x3060a0, 0.4));

  // Rim light from horizon
  const rim = new THREE.DirectionalLight(0x5aa8ff, 0.9);
  rim.position.set(0, 3, -60);
  scene.add(rim);

  // Fill from above
  const fill = new THREE.DirectionalLight(0x8ac8ff, 0.5);
  fill.position.set(20, 40, 20);
  scene.add(fill);
}

// ============================================================
// HEXAGON PANELS — floating tech hexagons scattered in atmosphere
// ============================================================
function buildHexPanels() {
  const hexGeo = new THREE.RingGeometry(1.4, 1.55, 6);
  const fillGeo = new THREE.CircleGeometry(1.4, 6);

  for (let i = 0; i < CONFIG.hexCount; i++) {
    const group = new THREE.Group();

    // Outer ring — brighter
    const ringMat = new THREE.MeshBasicMaterial({
      color: PAL.hex,
      transparent: true,
      opacity: 0.75,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const ring = new THREE.Mesh(hexGeo, ringMat);
    group.add(ring);

    // Inner fill — dimmer, glassy
    const fillMat = new THREE.MeshBasicMaterial({
      color: PAL.hexDim,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const fill = new THREE.Mesh(fillGeo, fillMat);
    fill.position.z = -0.001;
    group.add(fill);

    // Position — scattered through atmosphere in a broad band
    const a = Math.random() * Math.PI * 2;
    const r = 35 + Math.random() * 85;
    const h = 3 + Math.random() * 55;
    group.position.set(Math.cos(a) * r, h, Math.sin(a) * r);

    // Orientation — mostly facing inward toward camera area
    group.lookAt(0, group.position.y, 0);
    group.rotateZ(Math.random() * Math.PI * 2);

    const s = 0.7 + Math.random() * 1.4;
    group.scale.setScalar(s);

    group.userData.baseOpacity = 0.45 + Math.random() * 0.4;
    group.userData.pulsePhase = Math.random() * Math.PI * 2;
    group.userData.rotSpeed = (Math.random() - 0.5) * 0.15;
    group.userData.driftPhase = Math.random() * Math.PI * 2;
    group.userData.baseY = h;

    scene.add(group);
    hexPanels.push({ group, ringMat, fillMat });
  }
}

// ============================================================
// NETWORK NODES — glowing dots connected by faint lines (constellation)
// ============================================================
function buildNetwork() {
  // Generate node positions
  const positions = [];
  for (let i = 0; i < CONFIG.nodeCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * 90;
    const h = 5 + Math.random() * 45;
    positions.push(new THREE.Vector3(Math.cos(a) * r, h, Math.sin(a) * r));
  }

  // Build node spheres
  const nodeGeo = new THREE.SphereGeometry(0.18, 8, 8);
  for (let i = 0; i < positions.length; i++) {
    const mat = new THREE.MeshBasicMaterial({
      color: PAL.node,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const node = new THREE.Mesh(nodeGeo, mat);
    node.position.copy(positions[i]);
    node.userData.phase = Math.random() * Math.PI * 2;
    node.userData.baseScale = 0.8 + Math.random() * 0.7;
    node.scale.setScalar(node.userData.baseScale);
    scene.add(node);
    networkNodes.push(node);
  }

  // Build edges — connect nearby nodes only (sparse, elegant)
  const edgeMat = new THREE.LineBasicMaterial({
    color: PAL.hex,
    transparent: true,
    opacity: 0.18,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const connectionRadius = 32;
  const edgePairs = [];
  for (let i = 0; i < positions.length; i++) {
    for (let j = i + 1; j < positions.length; j++) {
      const d = positions[i].distanceTo(positions[j]);
      if (d < connectionRadius && Math.random() < 0.35) {
        edgePairs.push([i, j, d]);
      }
    }
  }
  // Limit total edges for perf and elegance
  edgePairs.sort((a, b) => a[2] - b[2]);
  const maxEdges = isMobile ? 40 : 70;
  const chosen = edgePairs.slice(0, maxEdges);

  const lineGeo = new THREE.BufferGeometry();
  const linePositions = new Float32Array(chosen.length * 6);
  chosen.forEach((pair, k) => {
    const a = positions[pair[0]], b = positions[pair[1]];
    linePositions[k*6]   = a.x; linePositions[k*6+1] = a.y; linePositions[k*6+2] = a.z;
    linePositions[k*6+3] = b.x; linePositions[k*6+4] = b.y; linePositions[k*6+5] = b.z;
  });
  lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
  const lines = new THREE.LineSegments(lineGeo, edgeMat);
  scene.add(lines);
  scene.userData.networkEdges = edgeMat;
}

// ============================================================
// WAVE RIBBONS — flowing sine-wave ribbons like the reference
// ============================================================
function buildWaveRibbons() {
  for (let w = 0; w < CONFIG.waveRibbonCount; w++) {
    const segments = 200;
    const width = 0.4;
    const ribbonGeo = new THREE.BufferGeometry();

    const vertices = new Float32Array(segments * 2 * 3);
    const uvs = new Float32Array(segments * 2 * 2);
    const indices = [];

    for (let i = 0; i < segments; i++) {
      const t = i / (segments - 1);
      const x = (t - 0.5) * 260;
      // Multiple overlapping sine waves for natural flow
      const y = Math.sin(t * Math.PI * 3 + w * 1.7) * 3.5
              + Math.sin(t * Math.PI * 7 + w * 2.3) * 1.2;
      const z = -30 - w * 15 + Math.sin(t * Math.PI * 5 + w) * 4;

      // Two vertices per slice — offset along local Y
      vertices[i*6]   = x; vertices[i*6+1] = y + width; vertices[i*6+2] = z;
      vertices[i*6+3] = x; vertices[i*6+4] = y - width; vertices[i*6+5] = z;
      uvs[i*4]   = t; uvs[i*4+1] = 0;
      uvs[i*4+2] = t; uvs[i*4+3] = 1;

      if (i < segments - 1) {
        const a = i * 2, b = i * 2 + 1, c = (i+1) * 2, d = (i+1) * 2 + 1;
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }

    ribbonGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    ribbonGeo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    ribbonGeo.setIndex(indices);

    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: {
        uTime:    { value: 0 },
        uColor:   { value: PAL.wave },
        uOffset:  { value: Math.random() * 10 },
        uOpacity: { value: 0.4 + Math.random() * 0.35 }
      },
      vertexShader: `
        uniform float uTime;
        uniform float uOffset;
        varying vec2 vUv;
        varying float vDist;
        void main() {
          vUv = uv;
          vec3 pos = position;
          // Additional vertical wave for flow
          pos.y += sin(pos.x * 0.08 + uTime * 0.6 + uOffset) * 0.8;
          pos.y += cos(pos.x * 0.2 + uTime * 0.9 + uOffset * 2.0) * 0.3;
          vDist = length(pos.xyz);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }`,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColor;
        uniform float uOffset;
        uniform float uOpacity;
        varying vec2 vUv;
        varying float vDist;

        void main() {
          // Edge fade across ribbon width
          float edge = smoothstep(0.0, 0.45, vUv.y) * smoothstep(1.0, 0.55, vUv.y);

          // Length fade — fade at both ends
          float fade = smoothstep(0.0, 0.12, vUv.x) * smoothstep(1.0, 0.88, vUv.x);

          // Traveling pulses along the ribbon
          float pulses = 0.0;
          for (int i = 0; i < 3; i++) {
            float fi = float(i);
            float p = fract(vUv.x * 2.0 - uTime * 0.12 + fi * 0.33);
            pulses += smoothstep(0.04, 0.0, abs(p - 0.5)) * 0.5;
          }

          // Subtle constant glow + pulses
          float base = 0.35;
          vec3 col = uColor * (base + pulses);
          float alpha = (base + pulses) * edge * fade * uOpacity;

          // Slight cyan-white for pulse cores
          col = mix(col, vec3(0.85, 0.95, 1.0), pulses * 0.6);

          gl_FragColor = vec4(col, alpha);
        }`
    });

    const mesh = new THREE.Mesh(ribbonGeo, mat);
    mesh.position.y = 12 + w * 4;
    mesh.position.z = -10 + w * 5;
    scene.add(mesh);
    waveRibbons.push(mat);
  }
}

// ============================================================
// DOT CLUSTERS — pixel-grid decorations in the air
// ============================================================
function buildDotClusters() {
  const dotGeo = new THREE.SphereGeometry(0.14, 6, 6);

  for (let c = 0; c < CONFIG.dataDotClusters; c++) {
    const clusterCount = 30 + Math.floor(Math.random() * 25);
    const clusterGeoPositions = [];

    // Grid-aligned cluster
    const gridW = 8, gridH = 5;
    const origin = new THREE.Vector3(
      (Math.random() - 0.5) * 120,
      8 + Math.random() * 40,
      -20 - Math.random() * 40
    );
    const cellSize = 1.2;

    for (let i = 0; i < gridW; i++) {
      for (let j = 0; j < gridH; j++) {
        if (Math.random() < 0.35) continue; // random missing cells
        clusterGeoPositions.push(new THREE.Vector3(
          origin.x + i * cellSize,
          origin.y + j * cellSize,
          origin.z + (Math.random() - 0.5) * 0.5
        ));
      }
    }

    const clusterMesh = new THREE.InstancedMesh(dotGeo, new THREE.MeshBasicMaterial({
      color: PAL.dot,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }), clusterGeoPositions.length);

    clusterGeoPositions.forEach((p, i) => {
      const dummy = new THREE.Object3D();
      dummy.position.copy(p);
      dummy.updateMatrix();
      clusterMesh.setMatrixAt(i, dummy.matrix);
    });
    clusterMesh.instanceMatrix.needsUpdate = true;
    scene.add(clusterMesh);
    dotClusters.push({
      mesh: clusterMesh,
      phase: Math.random() * Math.PI * 2,
      baseOpacity: 0.6 + Math.random() * 0.35
    });
  }
}

// ============================================================
// TECH ARCS — data lines sweeping across the sky
// ============================================================
function buildTechArcs() {
  const lineMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    uniforms: {
      uTime:  { value: 0 },
      uColor: { value: PAL.hex }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor;
      varying vec2 vUv;
      void main() {
        float fade = smoothstep(0.0, 0.15, vUv.x) * smoothstep(1.0, 0.85, vUv.x);
        float core = smoothstep(0.5, 0.0, abs(vUv.y - 0.5) * 2.0);
        float pulse = fract(vUv.x * 1.5 - uTime * 0.12);
        float pulseGlow = smoothstep(0.06, 0.0, abs(pulse - 0.5));
        vec3 col = uColor * (0.6 + pulseGlow * 0.9);
        float alpha = (core * 0.5 + pulseGlow * 0.8) * fade;
        gl_FragColor = vec4(col, alpha);
      }`
  });

  for (let i = 0; i < CONFIG.techLineCount; i++) {
    const a = (i / CONFIG.techLineCount) * Math.PI * 2 + Math.random() * 0.4;
    const radius = 130 + Math.random() * 60;
    const altitude = 35 + Math.random() * 35;
    const span = Math.PI * (0.3 + Math.random() * 0.35);

    const points = [];
    const segments = 40;
    const startA = a - span / 2;
    for (let s = 0; s <= segments; s++) {
      const t = s / segments;
      const ang = startA + span * t;
      const h = Math.sin(t * Math.PI) * altitude * 0.4 + altitude * 0.6;
      points.push(new THREE.Vector3(
        Math.cos(ang) * radius,
        h,
        Math.sin(ang) * radius
      ));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.5, 6, false);
    const mesh = new THREE.Mesh(tubeGeo, lineMat.clone());
    scene.add(mesh);
    techLines.push(mesh);
  }
}

// ============================================================
// CAMERA PATH
// ============================================================
function setupCameraPath() {
  const positions = [
    new THREE.Vector3(0, 10, 70),
    new THREE.Vector3(8, 12, 55),
    new THREE.Vector3(14, 16, 44),
    new THREE.Vector3(10, 24, 36),
    new THREE.Vector3(2, 34, 32),
    new THREE.Vector3(-8, 42, 30),
    new THREE.Vector3(-14, 52, 32),
    new THREE.Vector3(-10, 62, 38),
    new THREE.Vector3(-2, 74, 46),
    new THREE.Vector3(8, 84, 56)
  ];
  const looks = [
    new THREE.Vector3(0, 20, 0),
    new THREE.Vector3(0, 24, 0),
    new THREE.Vector3(0, 28, 0),
    new THREE.Vector3(0, 34, 0),
    new THREE.Vector3(0, 42, 0),
    new THREE.Vector3(0, 50, 0),
    new THREE.Vector3(0, 56, 0),
    new THREE.Vector3(0, 62, 0),
    new THREE.Vector3(0, 60, 0),
    new THREE.Vector3(0, 55, 0)
  ];
  cameraPath = new THREE.CatmullRomCurve3(positions, false, 'catmullrom', 0.5);
  lookAtPath = new THREE.CatmullRomCurve3(looks, false, 'catmullrom', 0.5);
}

// ============================================================
// SCROLL / RESIZE
// ============================================================
function setupScroll() {
  const update = () => {
    const top = window.scrollY || document.documentElement.scrollTop;
    const dh = document.documentElement.scrollHeight - window.innerHeight;
    if (dh > 0) scrollProgress = Math.min(1, Math.max(0, top / dh));
  };
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
}

function onWindowResize() {
  if (!renderer || !camera) return;
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(devicePixelRatio, CONFIG.maxPixelRatio));
  if (composer) {
    composer.setSize(w, h);
    const fxaa = scene.userData.fxaa;
    if (fxaa) fxaa.uniforms.resolution.value.set(1/(w*renderer.getPixelRatio()), 1/(h*renderer.getPixelRatio()));
  }
}

// ============================================================
// ANIMATE
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  if (isPaused) return;
  const delta = Math.min(clock.getDelta(), 0.05);
  time += delta;
  revealProgress = Math.min(1, revealProgress + delta * 0.35);

  smoothScroll += (scrollProgress - smoothScroll) * 0.075;

  // Camera
  if (pathReady && cameraPath && lookAtPath) {
    const t = Math.min(1, Math.max(0, smoothScroll));
    const targetPos = cameraPath.getPointAt(t);
    const targetLook = lookAtPath.getPointAt(t);
    if (revealProgress < 1) {
      const eased = 1 - Math.pow(1 - revealProgress, 3);
      const startPos = cameraPath.getPointAt(0).clone().multiplyScalar(1.3);
      camera.position.lerpVectors(startPos, targetPos, eased);
    } else {
      camera.position.lerp(targetPos, 0.07);
    }
    if (!camera.userData.smoothLook) camera.userData.smoothLook = targetLook.clone();
    camera.userData.smoothLook.lerp(targetLook, 0.06);
    camera.lookAt(camera.userData.smoothLook);
  }

  if (!CONFIG.reducedMotion) {
    if (skyMaterial) skyMaterial.uniforms.uTime.value = time;

    // Hexagon panels — pulse + slow rotation + gentle drift
    hexPanels.forEach((h) => {
      const pulse = 0.55 + Math.sin(time * 1.2 + h.group.userData.pulsePhase) * 0.4;
      h.ringMat.opacity = h.group.userData.baseOpacity * pulse;
      h.fillMat.opacity = 0.10 + pulse * 0.14;
      h.group.rotateZ(h.group.userData.rotSpeed * delta);
      h.group.position.y = h.group.userData.baseY +
        Math.sin(time * 0.4 + h.group.userData.driftPhase) * 1.2;
    });

    // Nodes pulse
    networkNodes.forEach((n) => {
      const pulse = 0.7 + Math.sin(time * 1.6 + n.userData.phase) * 0.5;
      n.scale.setScalar(n.userData.baseScale * (0.85 + pulse * 0.4));
      n.material.opacity = 0.5 + pulse * 0.5;
    });

    // Edge network subtle brightness shift
    if (scene.userData.networkEdges) {
      scene.userData.networkEdges.opacity = 0.14 + Math.sin(time * 0.6) * 0.06;
    }

    // Wave ribbons
    waveRibbons.forEach((m) => {
      if (m.uniforms) m.uniforms.uTime.value = time;
    });

    // Dot clusters
    dotClusters.forEach((c) => {
      const pulse = 0.6 + Math.sin(time * 1.0 + c.phase) * 0.4;
      c.mesh.material.opacity = c.baseOpacity * pulse;
    });

    // Tech arcs
    techLines.forEach((m) => {
      if (m.material.uniforms) m.material.uniforms.uTime.value = time;
    });
  }

  composer ? composer.render() : renderer.render(scene, camera);
}

// ============================================================
// INIT
// ============================================================
function init() {
  if (!initScene()) return;
  setupScroll();
  window.addEventListener('resize', onWindowResize, { passive: true });
  document.addEventListener('visibilitychange', () => {
    isPaused = document.hidden;
    if (!isPaused) clock.getDelta();
  });

  const indicator = document.getElementById('loading-indicator');
  if (indicator) setTimeout(() => indicator.classList.add('hidden'), 800);

  animate();

  window.ISHURI = {
    getScrollProgress: () => scrollProgress,
    getSmoothScroll: () => smoothScroll,
    setScrollProgress: (v) => { scrollProgress = Math.min(1, Math.max(0, v)); },
    scene, camera, renderer,
    ready: true
  };
  console.log('ISHURI ONLINE · Tech Atmosphere ready');
}
document.readyState === 'loading'
  ? document.addEventListener('DOMContentLoaded', init)
  : init();
</script>
</body>
