<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISHURI ONLINE · Admin</title>
<style>
  body { margin:0; background:#050a1f; color:#fff; font-family:system-ui, sans-serif; display:flex; min-height:100vh; }
  .sidebar { width:260px; background:rgba(14,42,94,0.4); border-right:1px solid rgba(74,184,255,0.2); padding:24px; }
  .main { flex:1; padding:40px; }
  h1 { font-size:24px; margin-bottom:20px; color:#6ac8ff; }
  .card { background:rgba(14,42,94,0.2); border:1px solid rgba(74,184,255,0.2); border-radius:16px; padding:24px; margin-bottom:20px; }
  .btn { padding:10px 20px; background:#4ab8ff; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
  .btn:hover { background:#2a70c8; }
  input, textarea { width:100%; padding:10px; margin-bottom:10px; background:rgba(0,0,0,0.3); border:1px solid rgba(74,184,255,0.3); color:#fff; border-radius:8px; }
  .nav-item { display:block; padding:12px; color:#8aa4bc; text-decoration:none; border-radius:8px; margin-bottom:4px; }
  .nav-item.active { background:rgba(74,184,255,0.1); color:#fff; border-left:3px solid #4ab8ff; }
</style>
</head>
<body>
  <div class="sidebar">
    <h2 style="font-size:16px; letter-spacing:0.1em; margin-bottom:30px;">ADMIN PANEL</h2>
    <a href="#" class="nav-item active">Courses</a>
    <a href="#" class="nav-item">Students</a>
    <a href="#" class="nav-item">Settings</a>
    <a href="dashboard.html" class="nav-item" style="margin-top:40px; border-top:1px solid rgba(74,184,255,0.1); padding-top:20px;">← Back to Student Dashboard</a>
  </div>
  <div class="main">
    <h1>Manage Courses</h1>
    <div class="card">
      <h3>Create New Course</h3>
      <input type="text" id="cTitle" placeholder="Course Title (e.g. Advanced Excel)">
      <input type="text" id="cCat" placeholder="Category (tech, business, etc.)">
      <input type="number" id="cModules" placeholder="Number of Modules">
      <button class="btn" onclick="alert('Course creation will be wired to Firestore in the next step!')">Create Course</button>
    </div>
    <div class="card">
      <h3>Existing Courses (Static Preview)</h3>
      <p style="color:#8aa4bc; font-size:14px;">Manage the 14 courses from here. In the next step, this will pull from the Firestore `courses` collection.</p>
    </div>
  </div>
</body>
</html>
